<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#2f5f9e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes tâches</title>
<style>
@font-face{font-family:Selawik;font-weight:300;src:url(fonts/selawkl.woff2) format('woff2');font-display:swap}
@font-face{font-family:Selawik;font-weight:350;src:url(fonts/selawksl.woff2) format('woff2');font-display:swap}
@font-face{font-family:Selawik;font-weight:400;src:url(fonts/selawk.woff2) format('woff2');font-display:swap}
@font-face{font-family:Selawik;font-weight:600;src:url(fonts/selawksb.woff2) format('woff2');font-display:swap}
:root{--accent:#2f5f9e;--acc:color-mix(in srgb,var(--accent) 62%,#1a1a1a);--bg:#f3f4f6;--panel:#fff;--text:#1f2430;--muted:#6b7280;--line:#e4e6ea;--shadow:0 1px 1px #0000000d,0 1px 3px #00000014;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--acc:color-mix(in srgb,var(--accent) 62%,#fff);--bg:#14161b;--panel:#1e2128;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c313b;--shadow:0 1px 1px #0006}}
:root[data-theme=dark]{--acc:color-mix(in srgb,var(--accent) 62%,#fff);--bg:#14161b;--panel:#1e2128;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c313b;--shadow:0 1px 1px #0006;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:350 15px/1.35 "Segoe UI",Selawik,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit;background:transparent;border:0;outline:0}
.i{display:block;flex-shrink:0;fill:currentColor}
#app{display:flex;height:100dvh}
/* connexion */
#login{height:100dvh;display:grid;place-items:center;padding:20px}
#login form{background:var(--panel);padding:28px;border-radius:8px;width:min(360px,100%);box-shadow:0 2px 12px #0002;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0 0 4px;font-weight:300;font-size:26px;color:var(--acc)}
#login input{border:1px solid var(--line);border-radius:4px;padding:11px}
#login .go{background:var(--acc);color:#fff;border-radius:4px;padding:12px;font-weight:600}
#lerr{color:#dc2626;font-size:14px;min-height:18px}
/* barre latérale */
#side{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px;overflow:auto;flex-shrink:0;touch-action:pan-y}
.acct{display:flex;align-items:center;gap:10px;padding:8px 6px 12px}
.avatar{width:34px;height:34px;border-radius:50%;background:#1f3f73;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex-shrink:0}
.who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.who b{font-weight:600;font-size:15px}
.nav{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:4px;width:100%;text-align:left;font-size:15.5px}
.nav:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}.nav.on{background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600}
.nav .n{margin-left:auto;color:var(--muted);font-size:14px;font-weight:350}
.nav .ic{width:22px;display:grid;place-items:center;flex-shrink:0;font-size:19px;line-height:1}
hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
/* principal */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
#head{display:flex;align-items:flex-start;gap:6px;padding:12px 10px 4px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--acc);flex-shrink:0}
.ib:hover{background:#00000012}
#menu{display:none}
.titles{flex:1;min-width:0;padding:5px 0 0 8px}
h1{margin:0;font-size:28px;font-weight:300;letter-spacing:-.2px;color:var(--acc);line-height:1.2}
#sub{color:var(--muted);font-size:15.5px;margin-top:1px}
#addbar{margin:8px 24px;background:var(--panel);border-radius:3px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);color:var(--acc)}
#addbar input{flex:1;min-width:0;color:var(--text);font-size:16px}
#searchbar{margin:8px 24px;background:var(--panel);border-radius:3px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;color:var(--acc)}
#searchbar input{flex:1;min-width:0;color:var(--text);font-size:16px}
#list{flex:1;overflow:auto;padding:6px 24px 110px;display:flex;flex-direction:column;overscroll-behavior:contain}
#list>*{flex-shrink:0}
.lines{flex:1 0 220px!important;margin-top:8px;background:repeating-linear-gradient(to bottom,transparent 0 63px,var(--line) 63px 64px);opacity:.8}
.wrap{position:relative;margin:1px 0;border-radius:3px;overflow:hidden}
.wrap.lift{z-index:6;box-shadow:0 8px 22px #0000004d;background:var(--panel);transition:none!important}
.bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;font-weight:600;font-size:14px;background:transparent}
.bg span{opacity:0}
.task{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;background:var(--panel);border-radius:3px;padding:11px 8px 11px 14px;min-height:60px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow)}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;display:grid;place-items:center;color:#fff}
.done .chk{background:var(--acc);border-color:var(--acc)}.done .t{text-decoration:line-through;color:var(--muted)}
.t{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta span+span::before{content:'•';margin-right:4px;opacity:.55}
.late{color:#dc2626}
.star{width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}.star.on{color:var(--acc)}
h3{margin:18px 0 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
h3.dn{text-transform:none;font-size:16px;font-weight:400;color:var(--acc);cursor:pointer;letter-spacing:0;user-select:none;display:flex;align-items:center;gap:8px}
h3.dn span{color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;margin-top:60px}
#fab{display:none;position:absolute;right:18px;bottom:24px;width:62px;height:62px;border-radius:50%;background:var(--acc);color:#fff;place-items:center;box-shadow:0 4px 12px #00000055;z-index:10}
#sugbtn{position:absolute;right:24px;bottom:24px;background:color-mix(in srgb,var(--acc) 88%,#000);color:#fff;border-radius:26px;padding:14px 22px 14px 18px;font-weight:600;box-shadow:0 4px 12px #00000047;z-index:10;display:flex;align-items:center;gap:10px}
/* détail */
#detail{width:360px;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;flex-shrink:0;display:none}
#detail.open{display:block}
#detail input.title{font-size:19px;font-weight:400;width:100%;padding:8px 0}
.dh{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.dh button{display:flex;align-items:center;gap:6px;font-size:14.5px;padding:6px 4px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .i{color:var(--muted)}
.row input[type=date]{margin-left:auto}
.row select,.tg select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
.step{display:flex;align-items:center;gap:10px;padding:7px 0}
.step input.s{flex:1}
.sm{font-size:13px;color:var(--muted)}
/* fenêtres */
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:60;padding:12px}
.box{background:var(--panel);border-radius:8px;padding:18px;width:min(400px,100%);max-height:90dvh;overflow:auto}
.box h2{margin:0 0 6px;font-weight:300;font-size:22px}
.box .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.box .btns button{padding:9px 14px;border-radius:4px}
.box .pri{color:var(--acc);font-weight:600}
.box input#pi{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:12px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 8px;border-radius:4px;font-size:15.5px}
.menu button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;justify-content:space-between;line-height:1.3}
.tg input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;background:color-mix(in srgb,var(--text) 22%,transparent);position:relative;flex-shrink:0;transition:.15s;cursor:pointer}
.tg input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px #0004}
.tg input[type=checkbox]:checked{background:var(--acc)}
.tg input[type=checkbox]:checked::after{left:23px}
.pal{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0 8px}
.dot{width:30px;height:30px;border-radius:50%;display:inline-block;cursor:pointer;margin:3px}
.dot.sel{outline:2px solid var(--text);outline-offset:2px}
.lbl{font-size:12.5px;color:var(--muted);margin:10px 0 0;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sug{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sug .t{font-size:16px}
#spanel{position:fixed;top:0;bottom:0;left:0;width:min(440px,100vw);background:var(--panel);z-index:55;transform:translateX(-100%);transition:transform .22s ease;overflow:auto;padding:10px 20px 40px;touch-action:pan-y;box-shadow:0 0 40px #0006}
#spanel.open{transform:none}
#spanel .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#spanel .ph h2{margin:0;font-weight:300;font-size:24px}
#sscrim{position:fixed;inset:0;background:#0005;z-index:54;opacity:0;transition:opacity .22s}
#sscrim.open{opacity:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:4px;display:none;gap:16px;z-index:70;align-items:center}
#toast button{color:#8ab8ff;font-weight:600}
/* mobile */
@media(max-width:800px){
 #side{position:fixed;inset:0 12% 0 0;z-index:30;width:auto;max-width:330px;transform:translateX(-100%);transition:transform .2s}
 #side.open{transform:none;box-shadow:0 0 40px #0006}
 #menu{display:grid}
 #detail.open{position:fixed;inset:0;width:auto;z-index:40}
 #addbar{display:none}
 body.adding #addbar{display:flex;position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:10px 10px 0 0;z-index:35;box-shadow:0 -2px 10px #0004;padding:16px}
 #searchbar{margin:8px 14px}
 #list{padding:6px 14px 120px}
 #fab{display:grid}
 body.adding #fab,body.adding #sugbtn{display:none}
 #sugbtn{right:96px}
 #toast{bottom:100px}
}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="lf">
    <h2>Mes tâches</h2>
    <input id="le" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <div id="lerr"></div>
    <button class="go" type="submit">Se connecter</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="side"></aside>
  <div id="main">
    <header id="head">
      <button class="ib" id="menu" aria-label="Listes"></button>
      <div class="titles"><h1 id="title"></h1><div id="sub"></div></div>
      <button class="ib" id="more" aria-label="Menu"></button>
    </header>
    <div id="searchbar" hidden><span id="sbi"></span><input id="sq" placeholder="Rechercher" autocomplete="off"></div>
    <div id="addbar"><span id="abi"></span><input id="newtask" placeholder="Ajouter une tâche" autocomplete="off" enterkeyhint="done"></div>
    <div id="list"></div>
    <button id="sugbtn" hidden></button>
    <button id="fab" aria-label="Ajouter une tâche"></button>
  </div>
  <aside id="detail"></aside>
</div>

const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PASTEL=['#8fb3d9','#9bc4a8','#e8a0a0','#b9a3d9','#f2b987','#86c5c9','#eaa9c8','#bdd48a','#a3adbb','#dcc28e','#c9a0a0','#9db7a6'];

const COLORS=[...DEEP,...PASTEL];
const DEF={accent:'#2f5f9e',addTop:true,starTop:true,sound:false,confirmDel:false,dueToday:true,parseDates:true,stripDates:false,theme:'system'};

let lists={},tasks={},view='myday',sel=null,settings={id:'settings',kind:'settings'},q='',showDone=true,session=null;
const S=()=>({...DEF,...settings});

/* ---------- Données locales + synchronisation Supabase ---------- */
const LS='todo2_cache',QS='todo2_queue';
let cache={},queue=[],flushing=false,started=false,channel=null,pullT=null,pulling=false;
try{queue=JSON.parse(localStorage.getItem(QS)||'[]')}catch(e){queue=[]}

function persist(){try{localStorage.setItem(LS,JSON.stringify(Object.values(cache)));localStorage.setItem(QS,JSON.stringify(queue))}catch(e){}}
function refresh(){ingest(Object.values(cache))}
function status(){
  const el=$('#sync');if(!el)return;
  const n=queue.length;
  el.textContent=!navigator.onLine?('⚠ Hors ligne'+(n?` · ${n} en attente`:'')):n?`⏳ ${n} en attente`:'✓ Synchronisé';
}
async function flush(){
  if(flushing||!navigator.onLine||!queue.length||!session){status();return}
  flushing=true;
  try{
    while(queue.length){
      const op=queue[0];let error;
      if(op.t==='set')({error}=await sb.from('items').upsert({id:op.id,data:op.data,updated_at:new Date().toISOString()}));
      else({error}=await sb.from('items').delete().eq('id',op.id));
      if(error){console.error(error);break}
      queue.shift();persist();
    }
  }catch(e){console.error(e)}
  flushing=false;status();
}
async function pull(){
  if(!session||pulling||!navigator.onLine)return;
  if(flushing||queue.length){pullSoon();return}
  pulling=true;
  try{
    const {data,error}=await sb.from('items').select('id,data');
    if(error){console.error(error);return}
    if(queue.length)return;
    cache={};data.forEach(r=>{cache[r.id]=r.data});
    persist();refresh();
    if(!Object.values(cache).some(o=>o.kind==='list'))seed();
  }catch(e){console.error(e)}finally{pulling=false}
}
function pullSoon(){clearTimeout(pullT);pullT=setTimeout(()=>flush().then(pull),500)}

const store={
  set:o=>{cache[o.id]=o;queue=queue.filter(x=>x.id!==o.id);queue.push({t:'set',id:o.id,data:o});persist();refresh();flush()},
  del:i=>{delete cache[i];queue=queue.filter(x=>x.id!==i);queue.push({t:'del',id:i});persist();refresh();flush()}
};
const save=o=>store.set(o);

function ingest(rows){
  lists={};tasks={};
  rows.forEach(r=>{
    if(!r)return;
    if(r.kind==='list')lists[r.id]=r;
    else if(r.kind==='task')tasks[r.id]=r;
    else if(r.kind==='settings')settings=r;
  });
  applyTheme();render();
}
function seed(){
  const l={id:'l_'+uid(),kind:'list',name:'Tâches',color:COLORS[0],order:0};
  store.set(l);view=l.id;render();
}
function applyTheme(){
  const t=S().theme;
  if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
}
function applyAccent(){
  document.documentElement.style.setProperty('--accent',lists[view]?lists[view].color:S().accent);
}

/* ---------- Connexion ---------- */
function showLogin(){$('#app').hidden=true;$('#login').hidden=false}
async function boot(){
  const {data}=await sb.auth.getSession();
  session=data.session;
  if(!session){showLogin();return}
  start();
}
function start(){
  $('#login').hidden=true;$('#app').hidden=false;
  if(started){pullSoon();return}
  started=true;
  try{cache=Object.fromEntries(JSON.parse(localStorage.getItem(LS)||'[]').map(o=>[o.id,o]))}catch(e){cache={}}
  refresh();status();
  flush().then(pull);
  channel=sb.channel('items-rt').on('postgres_changes',{event:'*',schema:'public',table:'items'},pullSoon).subscribe();
}
addEventListener('online',()=>{status();flush().then(pull)});
addEventListener('offline',status);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&started)flush().then(pull)});
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){session=null;started=false;showLogin()}else if(s){session=s}});
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();$('#lerr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
  if(error){
    const m=error.message||'';
    $('#lerr').textContent=/confirm/i.test(m)?'E-mail non confirmé.':/invalid/i.test(m)?'E-mail ou mot de passe incorrect.':'Connexion impossible : '+m;
    return;
  }
  session=data.session;start();
});
async function logout(){
  try{if(channel)sb.removeChannel(channel)}catch(e){}
  try{localStorage.removeItem(LS);localStorage.removeItem(QS)}catch(e){}
  cache={};queue=[];lists={};tasks={};settings={id:'settings',kind:'settings'};view='myday';sel=null;
  await sb.auth.signOut();
}

/* ---------- Dates ---------- */
const DAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MONTHS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
const W=s=>new RegExp('(?<![\\p{L}\\d/])(?:'+s+')(?![\\p{L}\\d/])','iu');
function parseDate(title){
  const td=new Date();td.setHours(12,0,0,0);
  const off=n=>{const d=new Date(td);d.setDate(d.getDate()+n);return iso(d)};
  const res=(m,due)=>({due,title:title.replace(m[0],' ').replace(/\s{2,}/g,' ').trim()});
  let m;
  if(m=title.match(W('apr[eè]s-demain')))return res(m,off(2));
  if(m=title.match(W('demain')))return res(m,off(1));
  if(m=title.match(W("aujourd['’]hui")))return res(m,off(0));
  if(m=title.match(W('dans (\\d+) (jours?|semaines?)')))return res(m,off(+m[1]*(/^s/i.test(m[2])?7:1)));
  if(m=title.match(W('(?:le |ce )?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?: prochain)?'))){
    const n=(DAYS.indexOf(m[1].toLowerCase())-td.getDay()+7)%7||7;return res(m,off(n))}
  if(m=title.match(/(?<![\d/])(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\d/])/)){
    const d=+m[1],mo=+m[2];let y=m[3]?+m[3]:td.getFullYear();if(y<100)y+=2000;
    let dt=new Date(y,mo-1,d,12);
    if(mo>=1&&mo<=12&&dt.getMonth()===mo-1){
      if(!m[3]&&iso(dt)<iso(td))dt=new Date(y+1,mo-1,d,12);
      return res(m,iso(dt));
    }
  }
  if(m=title.match(W('(?:le )?(\\d{1,2})(?:er)? (janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)'))){
    const mo=MONTHS.indexOf(m[2].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()),d=+m[1];
    let y=td.getFullYear(),dt=new Date(y,mo,d,12);
    if(dt.getMonth()===mo){if(iso(dt)<iso(td))dt=new Date(y+1,mo,d,12);return res(m,iso(dt))}
  }
  return {due:'',title};
}
function fmt(d){
  const t=today();
  if(d===t)return "Aujourd'hui";
  if(d===addDays(t,1))return 'Demain';
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
}
function nextDate(d,rep){const x=new Date(d+'T12:00:00');
  if(rep==='d')x.setDate(x.getDate()+1);if(rep==='w')x.setDate(x.getDate()+7);
  if(rep==='m')x.setMonth(x.getMonth()+1);if(rep==='y')x.setFullYear(x.getFullYear()+1);
  return iso(x)}

function tasksOf(v){
  const all=Object.values(tasks),td=today();
  if(v==='search'){const k=q.trim().toLowerCase();return k?all.filter(t=>((t.title||'')+' '+(t.notes||'')).toLowerCase().includes(k)):[]}
  if(v==='myday')return all.filter(t=>t.myDay===td||(S().dueToday&&t.due===td));
  if(v==='important')return all.filter(t=>t.star);
  if(v==='planned')return all.filter(t=>t.due);
  if(v==='all')return all;
  return all.filter(t=>t.list===v);
}
function suggestions(){
  const td=today(),lim=addDays(td,3);
  return Object.values(tasks).filter(t=>!t.done&&t.myDay!==td&&!(S().dueToday&&t.due===td)&&t.due&&t.due<=lim);

// ordre manuel (champ « ord » par liste, « dayOrd » pour Ma journée) ; sans ordre manuel : étoilées d'abord, puis date de création
function sortOpen(arr,field){
  const s=S();
  const rank=t=>(field&&t[field]!=null)?1:(s.starTop&&t.star?-1:(s.addTop?0:2));
  return arr.sort((a,b)=>{
    const ra=rank(a),rb=rank(b);
    if(ra!==rb)return ra-rb;
    if(ra===1)return a[field]-b[field];
    const d=(a.created||0)-(b.created||0);
    return s.addTop?-d:d;
  });
}
function nextOrd(field,group){
  const vals=group.filter(t=>t[field]!=null).map(t=>t[field]);
  if(!vals.length)return undefined;
  return S().addTop?Math.min(...vals)-1:Math.max(...vals)+1;
}

/* geste « glisser vers la gauche pour fermer » */
function swipeClose(el,close,onlyMobile){
  let sx=0,sy=0,dx=0,on=false,id=null,w=0;
  el.addEventListener('pointerdown',e=>{
    if(onlyMobile&&innerWidth>800)return;
    if(e.target.closest('input,textarea,select'))return;
    sx=e.clientX;sy=e.clientY;dx=0;on=false;id=e.pointerId;w=el.offsetWidth;
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(!on){
      if(Math.abs(mx)<10&&Math.abs(my)<10)return;
      if(Math.abs(my)>Math.abs(mx)||mx>0){id=null;return}
      on=true;try{el.setPointerCapture(id)}catch(_){}
      el.style.transition='none';
    }
    dx=Math.min(0,mx);el.style.transform=`translateX(${dx}px)`;
  });
  const end=e=>{
    if(e.pointerId!==id)return;
    const was=on;id=null;on=false;
    if(!was)return;
    el.style.transition='';
    if(dx<-Math.min(90,w*.25))close();else el.style.transform='';
    swipedClose=true;setTimeout(()=>swipedClose=false,120);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* ---------- Gestes sur les tâches : glisser (swipe) et appui long (réordonner) ---------- */
let swiped=false,drag=null,autoT=null;
const LIM=90,HOLD=380,GAP=2;
document.addEventListener('pointerdown',e=>{
  const task=e.target.closest('.task');
  if(!task||e.target.closest('button,.chk'))return;
  drag={task,id:task.dataset.id,x:e.clientX,y:e.clientY,curY:e.clientY,dx:0,mode:null,pid:e.pointerId,bg:task.parentElement.querySelector('.bg'),timer:null};
  if(reorderable()&&!task.classList.contains('done'))drag.timer=setTimeout(startReorder,HOLD);
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.curY=e.clientY;
  if(drag.mode==='reorder'){moveReorder();return}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.mode){
    if(Math.hypot(dx,dy)<8)return;
    clearTimeout(drag.timer);
    if(Math.abs(dy)>Math.abs(dx)){drag=null;return}
    drag.mode='swipe';try{drag.task.setPointerCapture(e.pointerId)}catch(_){}
  }
  drag.dx=dx;
  drag.task.style.transition='none';
  drag.task.style.transform=`translateX(${dx}px)`;
  const right=dx>0,ok=Math.abs(dx)>=LIM;
  drag.bg.style.background=right?'#d98a00':'#dc2626';
  drag.bg.style.opacity=ok?1:.7;
  drag.bg.querySelector('.bgl').style.opacity=right?1:0;
  drag.bg.querySelector('.bgr').style.opacity=right?0:1;
});
// empêche le défilement de la page pendant qu'on déplace une tâche
document.addEventListener('touchmove',e=>{if(drag&&drag.mode==='reorder')e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.task'))e.preventDefault()});

function startReorder(){
  if(!drag||drag.mode)return;
  const wrapEl=drag.task.parentElement;
  const rows=[...document.querySelectorAll('#list .wrap')].filter(w=>!w.querySelector('.task.done'));
  const start=rows.indexOf(wrapEl);
  if(start<0||rows.length<2){drag=null;return}
  drag.mode='reorder';
  drag.rows=rows;drag.start=start;drag.idx=start;
  drag.rects=rows.map(r=>{const b=r.getBoundingClientRect();return{top:b.top,h:b.height}});
  drag.scroll0=$('#list').scrollTop;
  wrapEl.classList.add('lift');
  rows.forEach(r=>{if(r!==wrapEl)r.style.transition='transform .15s'});
  try{drag.task.setPointerCapture(drag.pid)}catch(_){}
  try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
  autoT=setInterval(()=>{
    if(!drag||drag.mode!=='reorder')return;
    const l=$('#list'),b=l.getBoundingClientRect();
    if(drag.curY<b.top+70)l.scrollTop-=10;else if(drag.curY>b.bottom-70)l.scrollTop+=10;
    moveReorder();
  },16);
  moveReorder();
}
function moveReorder(){
  const d=drag;if(!d||d.mode!=='reorder')return;
  const dy=d.curY-d.y+($('#list').scrollTop-d.scroll0);
  const me=d.rects[d.start],center=me.top+me.h/2+dy;
  d.rows[d.start].style.transform=`translateY(${dy}px)`;
  let n=0;
  d.rects.forEach((r,i)=>{if(i!==d.start&&r.top+r.h/2<center)n++});
  d.idx=n;
  const shift=me.h+GAP*2;
  d.rows.forEach((r,i)=>{
    if(i===d.start)return;
    let s=0;
    if(d.start<n&&i>d.start&&i<=n)s=-shift;
    else if(d.start>n&&i<d.start&&i>=n)s=shift;
    r.style.transform=s?`translateY(${s}px)`:'';
  });
}
function endReorder(cancel){
  const d=drag;drag=null;clearInterval(autoT);
  d.rows.forEach(r=>{r.style.transition='';r.style.transform='';r.classList.remove('lift')});
  swiped=true;setTimeout(()=>swiped=false,200);
  if(cancel||d.idx===d.start){renderList();return}
  const ids=d.rows.map(w=>w.dataset.w);
  const m=ids.splice(d.start,1)[0];ids.splice(d.idx,0,m);
  const f=orderField();
  ids.forEach((id,i)=>{const t=tasks[id];if(t&&t[f]!==i)save({...t,[f]:i})});
  renderList();
}
function endDrag(e){
  if(!drag||e.pointerId!==drag.pid)return;
  clearTimeout(drag.timer);
  if(drag.mode==='reorder'){endReorder(e.type==='pointercancel');return}
  const d=drag;drag=null;
  if(d.mode!=='swipe')return;
  swiped=true;setTimeout(()=>swiped=false,60);
  d.task.style.transition='transform .15s';
  d.task.style.transform='translateX(0)';
  const t=tasks[d.id];if(!t||e.type==='pointercancel')return;
  if(d.dx>=LIM){setMyDay(t,!inMyDay(t))}
  else if(d.dx<=-LIM){
    const go=()=>{if(sel===t.id)sel=null;store.del(t.id);toast('Tâche supprimée',()=>save(t))};
    S().confirmDel?confirmDialog('Supprimer cette tâche ?',go):go();
  }
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- Actions ---------- */
function toggleStar(t){
  const o={...t,star:!t.star};
  if(o.star&&S().starTop){
    const d=nextOrd('ord',Object.values(tasks).filter(x=>x.list===t.list&&!x.done&&x.id!==t.id));
    if(d!==undefined)o.ord=S().addTop?d:Math.min(d,...Object.values(tasks).filter(x=>x.list===t.list&&x.ord!=null).map(x=>x.ord))-1;
  }
  save(o);
}
function toggle(t){
  const nt={...t,done:!t.done};
  save(nt);
  if(nt.done&&S().sound)beep();
  if(nt.done&&t.rep){
    save({...t,id:'t_'+uid(),done:false,due:nextDate(t.due||today(),t.rep),myDay:null,created:Date.now(),steps:(t.steps||[]).map(s=>({...s,done:false}))});
  }
}
function addTask(title){
  const lid=lists[view]?view:(Object.values(lists).sort(byOrder)[0]||{}).id;
  if(!lid)return;
  let due=view==='planned'?today():'';
  if(S().parseDates){const p=parseDate(title);if(p.due){due=p.due;if(S().stripDates&&p.title)title=p.title}}
  const t={id:'t_'+uid(),kind:'task',title,list:lid,done:false,star:view==='important',created:Date.now(),
    myDay:view==='myday'?today():null,due,steps:[],notes:'',rep:''};
  const o=nextOrd('ord',Object.values(tasks).filter(x=>x.list===lid&&!x.done));
  if(o!==undefined)t.ord=o;
  if(view==='myday'){const d=nextOrd('dayOrd',tasksOf('myday').filter(x=>!x.done));if(d!==undefined)t.dayOrd=d}
  save(t);
}

document.addEventListener('click',e=>{
  if(e.target.closest('.ov,#spanel,#sscrim'))return;
  if(swiped||swipedClose){e.stopPropagation();return}
  if($('#side').classList.contains('open')&&!e.target.closest('#side,#menu')){closeSide();return}
  const g=a=>e.target.closest('['+a+']');
  let el;
  if(el=g('data-chk')){e.stopPropagation();toggle(tasks[el.dataset.chk]);return}
  if(el=g('data-star')){e.stopPropagation();toggleStar(tasks[el.dataset.star]);return}
  if(el=g('data-v')){view=el.dataset.v;sel=null;closeSide();render();return}
  if(g('data-dn')){showDone=!showDone;renderList();return}
  if(e.target.closest('#gosearch')){view='search';q='';sel=null;closeSide();render();$('#sq').value='';$('#sq').focus();return}
  if(e.target.closest('#newlist')){closeSide();promptDialog('Nouvelle liste','',n=>{
    const l={id:'l_'+uid(),kind:'list',name:n,color:COLORS[Object.keys(lists).length%COLORS.length],order:Date.now()};
    save(l);view=l.id;render()},'Créer');return}
  if(e.target.closest('#opensettings')){closeSide();openSettings();return}
  if(e.target.closest('#logout')){closeSide();logout();return}
  if(e.target.closest('#menu')){$('#side').classList.toggle('open');return}
  if(e.target.closest('#more')){openMore();return}
  if(e.target.closest('#sugbtn')){openSuggestions();return}
  if(e.target.closest('#fab')){document.body.classList.add('adding');$('#newtask').focus();return}
  if(el=g('data-id')){sel=el.dataset.id;render();return}
  if(e.target.closest('#close')){sel=null;render();return}
  if(e.target.closest('#del')){
    const id=sel,t=tasks[id];
    const go=()=>{sel=null;store.del(id);toast('Tâche supprimée',()=>save(t))};
    S().confirmDel?confirmDialog('Supprimer cette tâche ?',go):go();return}
  if(e.target.closest('#d-day')){const t=tasks[sel];setMyDay(t,!inMyDay(t));return}
  if(e.target.closest('#d-nodue')){save({...tasks[sel],due:'',rep:''});return}
  if(el=g('data-sc')){const t=tasks[sel],s=[...t.steps],i=+el.dataset.sc;s[i]={...s[i],done:!s[i].done};save({...t,steps:s});return}
  if(el=g('data-sd')){const t=tasks[sel],s=[...t.steps];s.splice(+el.dataset.sd,1);save({...t,steps:s});return}
});
$('#newtask').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim()){addTask(e.target.value.trim());e.target.value=''}});
$('#newtask').addEventListener('blur',()=>setTimeout(()=>{if(!$('#newtask').value.trim())document.body.classList.remove('adding')},200));
$('#sq').addEventListener('input',e=>{q=e.target.value;renderList()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newstep'&&e.target.value.trim()){
    const t=tasks[sel];save({...t,steps:[...(t.steps||[]),{t:e.target.value.trim(),done:false}]})}
});
document.addEventListener('change',e=>{
  const t=tasks[sel];if(!t)return;
  const i=e.target.id;
  if(i==='d-title')save({...t,title:e.target.value.trim()||t.title});
  else if(i==='d-due')save({...t,due:e.target.value});
  else if(i==='d-rep')save({...t,rep:e.target.value,due:t.due||(e.target.value?today():'')});
  else if(i==='d-list')save({...t,list:e.target.value});
  else if(i==='d-notes')save({...t,notes:e.target.value});
  else if(e.target.dataset.si!==undefined){const s=[...t.steps],k=+e.target.dataset.si;s[k]={...s[k],t:e.target.value};save({...t,steps:s})}
});

/* icônes fixes de l'en-tête */
$('#menu').innerHTML=ic('back');$('#more').innerHTML=ic('more');
$('#abi').innerHTML=ic('add');$('#sbi').innerHTML=ic('search');$('#fab').innerHTML=ic('add',30);
$('#sugbtn').innerHTML=ic('bulb',22)+'<span>Suggestions</span>';
swipeClose($('#side'),closeSide,true);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(console.error);
boot();
</script>
</body>
